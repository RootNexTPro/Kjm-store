<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Achats - KJM Store Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="index.html" class="text-2xl font-bold text-indigo-600">KJM Store Online</a>
                <a href="index.html" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors hidden sm:block">Boutique</a>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-sm font-medium text-gray-500">Devise: XAF</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-12">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-gray-900 mb-3">Portail Client</h1>
            <p class="text-gray-600 max-w-xl mx-auto">Retrouvez l'historique de vos achats et accédez à vos produits digitaux en un instant.</p>
        </div>

        <!-- Search Form -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 mb-10">
            <form id="search-form" class="flex flex-col sm:flex-row gap-4">
                <div class="flex-grow">
                    <label for="email" class="sr-only">Adresse email</label>
                    <input type="email" id="email" required placeholder="Entrez l'email utilisé lors de votre commande" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button type="submit" id="search-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition-colors whitespace-nowrap flex items-center justify-center">
                    <span>Retrouver mes achats 🔍</span>
                </button>
            </form>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden text-center py-10">
            <svg class="animate-spin h-8 w-8 text-indigo-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-gray-500">Recherche de vos achats en cours...</p>
        </div>

        <!-- Results Container -->
        <div id="results" class="space-y-6">
            <!-- Cards will be injected here -->
        </div>

    </main>

    <script>
        const POCKETBASE_URL = window.location.origin;
        const form = document.getElementById('search-form');
        const emailInput = document.getElementById('email');
        const searchBtn = document.getElementById('search-btn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const supportNumber = '237000000000'; // Replace with actual number

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            if (!email) return;

            searchBtn.disabled = true;
            loading.classList.remove('hidden');
            results.innerHTML = '';

            try {
                // Fetch paid orders for this email
                const ordersRes = await fetch(`${POCKETBASE_URL}/api/collections/orders/records?filter=(customer_email='${email}' && status='paid')&sort=-created`);
                const ordersData = await ordersRes.json();

                if (ordersData.items && ordersData.items.length > 0) {
                    for (const order of ordersData.items) {
                        // For each order, fetch product details to get file
                        const productRes = await fetch(`${POCKETBASE_URL}/api/collections/products/records?filter=(title='${order.product_title.replace(/'/g, "\\'")}')`);
                        const productData = await productRes.json();

                        let fileUrl = '#';
                        let hasFile = false;

                        if (productData.items && productData.items.length > 0) {
                            const product = productData.items[0];
                            if (product.file) {
                                fileUrl = `${POCKETBASE_URL}/api/files/${product.collectionId}/${product.id}/${product.file}`;
                                hasFile = true;
                            }
                        }

                        const date = new Date(order.created).toLocaleDateString('fr-FR', {
                            year: 'numeric', month: 'long', day: 'numeric'
                        });

                        const card = document.createElement('div');
                        card.className = 'bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 transition-shadow hover:shadow-md';

                        card.innerHTML = `
                            <div class="flex-grow">
                                <h3 class="text-lg font-bold text-gray-900 mb-1">${order.product_title}</h3>
                                <div class="text-sm text-gray-500 space-y-1">
                                    <p>Acheté le : ${date}</p>
                                    <p>Référence : <span class="font-mono bg-gray-100 px-1 py-0.5 rounded text-gray-700">${order.reference}</span></p>
                                </div>
                            </div>
                            <div class="w-full md:w-auto flex-shrink-0">
                                ${hasFile
                                    ? `<a href="${fileUrl}" target="_blank" class="w-full md:w-auto inline-flex items-center justify-center bg-indigo-50 text-indigo-700 hover:bg-indigo-100 font-semibold py-2.5 px-5 rounded-lg transition-colors border border-indigo-200">
                                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                        Télécharger mon produit ⬇️
                                       </a>`
                                    : `<div class="bg-gray-100 text-gray-600 px-4 py-2 rounded-lg text-sm text-center">Produit envoyé par email</div>`
                                }
                            </div>
                        `;
                        results.appendChild(card);
                    }
                } else {
                    // No paid purchases found
                    const supportMsg = encodeURIComponent(`Bonjour, je ne retrouve pas mes achats avec l'email ${email}. Pouvez-vous m'aider ?`);
                    results.innerHTML = `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 text-center">
                            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                            <h3 class="text-xl font-bold text-gray-900 mb-2">Aucun achat trouvé</h3>
                            <p class="text-gray-500 mb-6 max-w-md mx-auto">Nous n'avons trouvé aucune commande validée pour l'adresse <span class="font-semibold text-gray-700">${email}</span>.</p>
                            <a href="https://wa.me/${supportNumber}?text=${supportMsg}" target="_blank" class="inline-flex items-center justify-center bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-6 rounded-lg transition-colors">
                                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                                Contacter le support sur WhatsApp
                            </a>
                        </div>
                    `;
                }
            } catch (err) {
                console.error(err);
                results.innerHTML = `
                    <div class="bg-red-50 text-red-700 p-4 rounded-lg text-center border border-red-200">
                        Une erreur est survenue lors de la recherche. Veuillez réessayer.
                    </div>
                `;
            } finally {
                loading.classList.add('hidden');
                searchBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
